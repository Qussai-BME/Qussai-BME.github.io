<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Qussai Adlbi — Redirecting…</title>
    <!--
      GitHub Pages has no server-side routing, so a direct link to a route
      like /research/lite-dan returns this 404 page. This script rewrites
      the path into a query string and redirects to index.html, where a
      matching snippet restores the real URL. Standard, widely-used fix
      for single-page apps on GitHub Pages (github.com/rafgraph/spa-github-pages).
    -->
    <script>
      var segmentCount = 0;
      var l = window.location;
      l.replace(
        l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
        l.pathname.split("/").slice(0, 1 + segmentCount).join("/") + "/?/" +
        l.pathname.slice(1).split("/").slice(segmentCount).join("/").replace(/&/g, "~and~") +
        (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
